<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐘 Vinayaki_2026 · Mensajera de Ganesha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --saffron: #ff9933;
            --deep-saffron: #e8730c;
            --gold: #ffd166;
            --maroon: #5c1a0e;
            --dark: #2a1206;
            --cream: #fff7e6;
            --card-bg: rgba(255, 247, 230, 0.92);
            --glow: 0 0 20px rgba(255, 153, 51, 0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,153,51,0.35), transparent 70%),
                radial-gradient(ellipse 60% 50% at 85% 110%, rgba(232,115,12,0.25), transparent 70%),
                radial-gradient(ellipse 50% 40% at 10% 100%, rgba(255,209,102,0.18), transparent 70%),
                linear-gradient(160deg, #1d0c04 0%, var(--dark) 45%, #3a1608 100%);
            color: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        /* ---------- Fondo animado: canvas OM + destellos ---------- */
        #fondoCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ---------- Tarjeta principal ---------- */
        .tarjeta {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2.2rem 2rem 2rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.6);
            border: 1px solid rgba(255, 209, 102, 0.55);
            animation: aparecerTarjeta 0.9s cubic-bezier(0.22, 1, 0.36, 1);
            color: var(--maroon);
        }

        @keyframes aparecerTarjeta {
            from { opacity: 0; transform: translateY(35px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---------- Ornamento superior ---------- */
        .ornamento {
            text-align: center;
            font-size: 2.6rem;
            margin-bottom: 0.2rem;
            filter: drop-shadow(0 0 12px rgba(255,153,51,0.7));
            animation: flotar 4s ease-in-out infinite;
            user-select: none;
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        .divisor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0.6rem 0 1.4rem;
            color: var(--deep-saffron);
        }
        .divisor::before, .divisor::after {
            content: '';
            height: 1px;
            width: 90px;
            background: linear-gradient(90deg, transparent, var(--saffron), transparent);
        }

        h1 {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(120deg, #b45309, #e8730c, #b45309);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: brilloTexto 5s linear infinite;
        }

        @keyframes brilloTexto {
            to { background-position: 200% center; }
        }

        .subtitulo {
            text-align: center;
            font-size: 0.85rem;
            color: #8a5a1c;
            margin-top: 4px;
            margin-bottom: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* ---------- Campos ---------- */
        label.campo {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a3651f;
            margin-bottom: 6px;
        }

        input, textarea, select {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 16px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            color: var(--maroon);
            background: #fffdf6;
            border: 1.5px solid #e6c98a;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, transform 0.15s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--saffron);
            box-shadow: 0 0 0 4px rgba(255,153,51,0.18), var(--glow);
            transform: translateY(-1px);
        }

        textarea { resize: vertical; min-height: 100px; line-height: 1.5; }

        /* ---------- Botones ---------- */
        button {
            font-family: 'Poppins', sans-serif;
            border: none;
            cursor: pointer;
            font-weight: 600;
            border-radius: 12px;
            transition: transform 0.15s, box-shadow 0.25s, background 0.25s, opacity 0.2s;
        }

        button:active:not(:disabled) { transform: scale(0.97); }

        #btnConsultar {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            letter-spacing: 0.5px;
            color: #fff;
            background: linear-gradient(135deg, var(--saffron) 0%, var(--deep-saffron) 100%);
            box-shadow: 0 6px 18px rgba(232,115,12,0.4);
            position: relative;
            overflow: hidden;
        }

        #btnConsultar::after {
            content: '';
            position: absolute;
            top: 0; left: -80%;
            width: 50%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
            transform: skewX(-20deg);
            animation: destelloBoton 3.5s ease-in-out infinite;
        }

        @keyframes destelloBoton {
            0%, 60% { left: -80%; }
            100%    { left: 130%; }
        }

        #btnConsultar:hover:not(:disabled) {
            box-shadow: 0 8px 24px rgba(232,115,12,0.55);
            transform: translateY(-2px);
        }

        #btnConsultar:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #btnConsultar .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2.5px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: -3px;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar { to { transform: rotate(360deg); } }

        .fila-voz {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }
        .fila-voz select { flex: 1; margin-bottom: 16px; }

        .btn-secundario {
            padding: 0 18px;
            margin-bottom: 16px;
            background: #fdf0da;
            color: #a3651f;
            border: 1.5px solid #e6c98a;
            white-space: nowrap;
        }
        .btn-secundario:hover { background: #fbe3bc; box-shadow: 0 4px 12px rgba(232,115,12,0.2); }

        .row {
            display: flex;
            gap: 10px;
        }
        .row button { flex: 1; padding: 13px; }

        #btnEscuchar {
            color: #fff;
            background: linear-gradient(135deg, #d97706, #b45309);
            box-shadow: 0 4px 14px rgba(180,83,9,0.35);
        }
        #btnEscuchar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(180,83,9,0.5); }

        #btnDetener { background: #dc2626; color: #fff; box-shadow: 0 4px 14px rgba(220,38,38,0.3); }
        #btnDetener:hover { background: #b91c1c; transform: translateY(-2px); }

        .opciones {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 0.88rem;
            color: #7a4a12;
            user-select: none;
        }
        .opciones input[type="checkbox"] {
            width: 18px; height: 18px;
            margin: 0;
            accent-color: var(--deep-saffron);
            cursor: pointer;
        }

        /* ---------- Respuesta ---------- */
        .titulo-respuesta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: #7a3a08;
            margin-bottom: 10px;
        }

        #resultado {
            background: linear-gradient(180deg, #fffdf6, #fdf3dd);
            padding: 18px;
            min-height: 80px;
            border-radius: 14px;
            border: 1.5px solid #e6c98a;
            box-shadow: inset 0 2px 8px rgba(180,83,9,0.08);
            white-space: pre-wrap;
            font-size: 1.02rem;
            line-height: 1.65;
            color: #4a2410;
        }

        #resultado.animar-respuesta { animation: aparecerRespuesta 0.6s ease; }

        @keyframes aparecerRespuesta {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #resultado.procesando {
            color: #a3651f;
            font-style: italic;
        }

        .puntos-carga::after {
            content: '';
            animation: puntos 1.4s steps(4, end) infinite;
        }

        @keyframes puntos {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
        }

        .pie {
            text-align: center;
            margin-top: 1.4rem;
            font-size: 0.75rem;
            color: #b08a4f;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .tarjeta { padding: 1.6rem 1.2rem; }
            h1 { font-size: 1.6rem; }
        }
    </style>
<base target="_blank">
</head>
<body>

    <canvas id="fondoCanvas"></canvas>

    <div class="tarjeta">
        <div class="ornamento">🐘</div>
        <h1>Vinayaki_2026</h1>
        <p class="subtitulo">✦ Mensajera entre tú y Ganesha ✦</p>
        <div class="divisor">ॐ</div>

        <label class="campo" for="apiKey">Llave sagrada (API Key de Groq)</label>
        <input type="password" id="apiKey" placeholder="Pega aquí tu API Key de Groq" autocomplete="off">

        <label class="campo" for="pregunta">Tu consulta</label>
        <textarea id="pregunta" rows="4" placeholder="Escribe aquí lo que deseas consultar a Ganesha..."></textarea>

        <button id="btnConsultar" onclick="preguntar()">🙏 Consultar a Ganesha</button>

        <label class="campo" for="vozSelect">Voz de la mensajera</label>
        <div class="fila-voz">
            <select id="vozSelect"></select>
            <button class="btn-secundario" onclick="cargarVoces()" title="Recargar voces">↻</button>
        </div>

        <div class="opciones">
            <input type="checkbox" id="autoLeer" checked>
            <label for="autoLeer">Leer la respuesta en voz alta automáticamente</label>
        </div>

        <div class="row">
            <button id="btnEscuchar" onclick="leerRespuesta()">🔊 Escuchar</button>
            <button id="btnDetener" onclick="detenerVoz()">⏹ Detener</button>
        </div>

        <h3 class="titulo-respuesta">📿 Respuesta de Vinayaki_2026</h3>
        <div id="resultado">Esperando tu consulta...</div>

        <p class="pie">Que Ganesha remueva los obstáculos de tu camino ॐ</p>
    </div>

    <script>
        // ============================================================
        //  FONDO ANIMADO: símbolos OM flotantes + estrellas destellantes
        // ============================================================
        const canvas = document.getElementById('fondoCanvas');
        const ctx = canvas.getContext('2d');
        let particulas = [];

        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => { redimensionar(); iniciarParticulas(); });
        redimensionar();

        function crearParticula(inicial) {
            const azar = Math.random();
            const tipo = azar < 0.30 ? 'om' : (azar < 0.65 ? 'estrella' : 'brillo');
            return {
                tipo: tipo,
                x: Math.random() * canvas.width,
                y: inicial ? Math.random() * canvas.height : canvas.height + 40,
                tam: tipo === 'om' ? 20 + Math.random() * 26
                     : tipo === 'estrella' ? 6 + Math.random() * 10
                     : 1.5 + Math.random() * 2.5,
                velocidad: 0.2 + Math.random() * 0.5,
                deriva: (Math.random() - 0.5) * 0.4,
                opacidad: 0.35 + Math.random() * 0.55,
                pulsacion: Math.random() * Math.PI * 2,
                pulsVel: 0.01 + Math.random() * 0.025,
                rotacion: Math.random() * Math.PI,
                rotVel: (Math.random() - 0.5) * 0.01,
                color: ['255, 209, 102', '255, 153, 51', '255, 230, 160'][Math.floor(Math.random() * 3)]
            };
        }

        function iniciarParticulas() {
            const total = Math.min(140, Math.floor(window.innerWidth / 10));
            particulas = Array.from({ length: total }, () => crearParticula(true));
        }
        iniciarParticulas();

        function dibujarEstrella(x, y, radio, alpha, rotacion) {
            // Estrella de 4 puntas (destello de luz)
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotacion);
            ctx.strokeStyle = `rgba(255, 240, 200, ${alpha})`;
            ctx.lineWidth = 1.4;
            ctx.lineCap = 'round';
            ctx.shadowColor = `rgba(255, 200, 90, ${alpha})`;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const ang = (Math.PI / 2) * i;
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(ang) * radio, Math.sin(ang) * radio);
            }
            ctx.stroke();
            // Nucleo brillante
            ctx.fillStyle = `rgba(255, 250, 220, ${alpha})`;
            ctx.beginPath();
            ctx.arc(0, 0, radio * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function dibujar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let p of particulas) {
                p.pulsacion += p.pulsVel;
                p.rotacion += p.rotVel;
                p.y -= p.velocidad;
                p.x += p.deriva + Math.sin(p.pulsacion * 0.6) * 0.25;

                const alpha = Math.min(1, p.opacidad * (0.55 + 0.45 * Math.sin(p.pulsacion)));

                if (p.tipo === 'om') {
                    ctx.save();
                    ctx.font = `600 ${p.tam}px 'Noto Sans Devanagari', 'Mangal', serif`;
                    ctx.fillStyle = `rgba(${p.color}, ${alpha})`;
                    ctx.shadowColor = `rgba(255, 180, 80, ${alpha * 0.9})`;
                    ctx.shadowBlur = 16;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('ॐ', p.x, p.y);
                    ctx.restore();
                } else if (p.tipo === 'estrella') {
                    dibujarEstrella(p.x, p.y, p.tam, alpha, p.rotacion);
                } else {
                    // brillo suave difuso
                    const radio = p.tam * 4;
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radio);
                    grad.addColorStop(0, `rgba(255, 245, 210, ${alpha})`);
                    grad.addColorStop(0.5, `rgba(${p.color}, ${alpha * 0.5})`);
                    grad.addColorStop(1, 'rgba(255,153,51,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radio, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (p.y < -50 || p.x < -50 || p.x > canvas.width + 50) {
                    Object.assign(p, crearParticula(false));
                }
            }
            requestAnimationFrame(dibujar);
        }
        dibujar();

        // ============================================================
        //  TTS (Web Speech API)
        // ============================================================
        const synth = window.speechSynthesis;
        let vocesEspanol = [];

        function cargarVoces() {
            const todasLasVoces = synth.getVoices();
            vocesEspanol = todasLasVoces.filter(v => v.lang.toLowerCase().startsWith('es'));
            const select = document.getElementById('vozSelect');
            const valorPrevio = select.value;
            select.innerHTML = '';

            const listaAUsar = vocesEspanol.length > 0 ? vocesEspanol : todasLasVoces;
            listaAUsar.forEach((voz) => {
                const opt = document.createElement('option');
                opt.value = voz.name;
                opt.textContent = `${voz.name} (${voz.lang})`;
                select.appendChild(opt);
            });

            if (valorPrevio) select.value = valorPrevio;

            if (listaAUsar.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = 'No hay voces disponibles todavía...';
                select.appendChild(opt);
            }
        }

        cargarVoces();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = cargarVoces;
        }

        function leerRespuesta() {
            const resultadoDiv = document.getElementById('resultado');
            const texto = resultadoDiv.innerText;
            if (!texto || texto.includes('Esperando tu consulta') || resultadoDiv.classList.contains('procesando')) return;

            detenerVoz();

            const utter = new SpeechSynthesisUtterance(texto);
            const nombreVoz = document.getElementById('vozSelect').value;
            const vozElegida = synth.getVoices().find(v => v.name === nombreVoz);

            if (vozElegida) {
                utter.voice = vozElegida;
                utter.lang = vozElegida.lang;
            } else {
                utter.lang = 'es-ES';
            }

            utter.rate = 1;
            utter.pitch = 1;
            synth.speak(utter);
        }

        function detenerVoz() {
            if (synth.speaking || synth.pending) {
                synth.cancel();
            }
        }

        // ============================================================
        //  Consulta a la API de Groq
        // ============================================================
        async function preguntar() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const pregunta = document.getElementById('pregunta').value.trim();
            const resultadoDiv = document.getElementById('resultado');
            const btn = document.getElementById('btnConsultar');

            if (!apiKey || !pregunta) {
                resultadoDiv.classList.remove('procesando');
                resultadoDiv.innerText = 'Por favor, ingresa tu API Key y tu consulta. 🙏';
                resultadoDiv.classList.remove('animar-respuesta');
                void resultadoDiv.offsetWidth;
                resultadoDiv.classList.add('animar-respuesta');
                return;
            }

            detenerVoz();
            resultadoDiv.classList.add('procesando');
            resultadoDiv.innerHTML = '<span class="puntos-carga">Vinayaki eleva tu mensaje a Ganesha</span>';
            resultadoDiv.classList.remove('animar-respuesta');
            void resultadoDiv.offsetWidth;
            resultadoDiv.classList.add('animar-respuesta');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Consultando...';

            const systemPrompt = `Eres Vinayaki_2026, una intermediaria espiritual que habla en nombre de Ganesha, el dios hindú de la sabiduría, la remoción de obstáculos y los nuevos comienzos. Respondes con calidez, calma y un tono reverente, como quien transmite un mensaje sagrado. Incorpora ocasionalmente elementos de la tradición y simbología de Ganesha (el modak, el ratón Mushika, el hacha que corta el apego, el lazo que atrae, la sabiduría del elefante) de forma poética pero cercana. Ofrece consejo, consuelo o reflexión espiritual según lo que la persona consulte, dejando claro que hablas como mensajera y no como sustituto de decisiones médicas, legales o financieras profesionales. Sé respetuosa con la tradición hindú y evita afirmaciones dogmáticas o divisivas sobre otras religiones.`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'openai/gpt-oss-120b',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: pregunta }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                resultadoDiv.classList.remove('procesando');

                if (data.choices && data.choices[0]) {
                    resultadoDiv.innerText = data.choices[0].message.content;
                    if (document.getElementById('autoLeer').checked) {
                        leerRespuesta();
                    }
                } else {
                    resultadoDiv.innerText = 'Error: ' + (data.error?.message || 'Revisa tu API Key.');
                }
            } catch (error) {
                resultadoDiv.classList.remove('procesando');
                resultadoDiv.innerText = 'Error de conexión. Verifica tu internet o tu API Key.';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🙏 Consultar a Ganesha';
            }
        }
    </script>
</body>
</html>
